name: Collect & deploy

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # commit check results
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check crypto infrastructure
        run: node scripts/infra.mjs

      - name: Snapshot Polymarket odds
        run: node scripts/markets.mjs
        continue-on-error: true   # a Polymarket hiccup must not block the uptime data

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/infra.json site/data/markets.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: collect data $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

  deploy:
    needs: check
    # runs after a check, and also on a plain push (when "check" is skipped)
    if: always() && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the commit made by the check job

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
